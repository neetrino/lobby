services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lobby
      POSTGRES_PASSWORD: lobby
      POSTGRES_DB: lobby
    ports:
      - "5432:5432"
      # Host port 5432 is often taken by a local Postgres service. 54329 reaches this container directly.
      - "54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lobby -d lobby"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
